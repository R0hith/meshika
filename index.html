<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshika — Our Beloved Little Star ♥</title>
  <style>
    :root {
      --bg-color: #fcfcfc;
      --card-bg: #ffffff;
      --accent-soft: #ffebee;
      --accent-mid: #ffd1dc;
      --accent-strong: #ff8a80;
      --soft-gold: #f4d35e;
      --text-dark: #373e4a;
      --text-muted: #8c9096;
      --text-gold: #c79836;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding-bottom: 50px;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    
    header h1 {
      font-size: 2.8rem;
      color: var(--text-dark);
      font-weight: 700;
    }
    
    header p.subtitle {
      font-size: 1.15rem;
      color: var(--text-gold);
      font-weight: 500;
      margin-top: 5px;
    }

    .heart { color: var(--accent-strong); }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .section-title {
      font-size: 1.5rem;
      color: var(--text-dark);
      margin: 30px 0 15px;
      font-weight: 600;
    }

    /* Drive Folder Frame */
    .drive-container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      border: 4px solid var(--accent-soft);
      overflow: hidden;
      height: 650px;
      margin-bottom: 30px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap');
  </style>
</head>
<body>

  <header>
    <h1>Meshika ✦</h1>
    <p class="subtitle">Our Happy, Playful, Naughty, & Beloved Little Star <span class="heart">♥</span></p>
  </header>

  <div class="container">

    <!-- All 100+ Videos Collection -->
    <h2 class="section-title">Meshika's Video Collection (100+ Videos)</h2>
    <div class="drive-container">
      <iframe src="https://drive.google.com/embeddedfolderview?id=1E2ZQ5uL-1bC4vI57ps70CRxi-xYZ0JAN#grid"></iframe>
    </div>

    <!-- Photos Collection -->
    <h2 class="section-title">Meshika's Photo Memories</h2>
    <div class="drive-container">
      <iframe src="https://drive.google.com/embeddedfolderview?id=1LAsw83qJlrhF6O-V8zfwbfgfubp5aVCG#grid"></iframe>
    </div>

  </div>

  <footer>
    <p>In Loving Memory of Meshika — Forever in our hearts ♥</p>
  </footer>

</body>
</html>
